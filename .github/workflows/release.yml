name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to publish to npm (e.g. v1.3.2). Leave empty unless retrying a tagged release.'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}

  release-please:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [ci, release-please]
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned here, not read from .nvmrc: a manual re-publish can check out a tag cut before .nvmrc existed.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm (OIDC)
        run: |
          VERSION=$(jq -r .version package.json)
          if npm view "mcp-server-db2i@${VERSION}" version >/dev/null 2>&1; then
            echo "mcp-server-db2i@${VERSION} is already on npm; skipping publish"
          else
            npm publish --access public
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: |
          # npm can return 404 for a version that was just published. The registry
          # treats that as a hard failure, so retry for up to 10 minutes. The job
          # timeout is 15 minutes and the earlier steps need a few of them.
          for attempt in $(seq 1 20); do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Registry publish failed (attempt ${attempt}/20). Waiting 30s for npm."
            sleep 30
          done
          exit 1
