name: Website

# Builds the site in site/ on pull requests, and deploys it to GitHub Pages
# (https://db2i-mcp.com) on pushes to main. The server's CI is in ci.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Public widget ID for the Mintlify assistant. Unset: the site builds without the widget.
          PUBLIC_MINTLIFY_WIDGET_ID: ${{ vars.MINTLIFY_WIDGET_ID }}
          # Public PostHog project key (EU cloud). Unset: the site builds without analytics.
          PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
