name: Web app

# Checks the example web app in examples/web-app on pull requests and pushes to
# main that touch it. Nothing is deployed. The server's CI is in ci.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/web-app/**'
      - '.github/workflows/web-app.yml'
  push:
    branches: [main]
    paths:
      - 'examples/web-app/**'
      - '.github/workflows/web-app.yml'
  workflow_dispatch:

concurrency:
  group: web-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/web-app
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: examples/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
