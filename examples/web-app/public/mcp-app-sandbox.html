<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MCP App sandbox</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
// Sandbox proxy for MCP Apps views (see components/result-app.tsx). The chat
// sends the view's HTML here; it runs in an inner iframe without
// allow-same-origin, so it cannot reach this app's cookies, storage or API.
// Messages are relayed both ways. The Content-Security-Policy header on this
// page (next.config.ts) is inherited by the inner document and blocks every
// network request from it.
(() => {
  const host = location.origin;
  const refused = new Set(['allow-same-origin', 'allow-top-navigation', 'allow-popups-to-escape-sandbox']);
  let inner = null;

  window.addEventListener('message', (event) => {
    if (event.source === window.parent && event.origin === host) {
      const message = event.data;
      if (message?.jsonrpc === '2.0' && message.method === 'ui/notifications/sandbox-resource-ready') {
        const { html, sandbox } = message.params ?? {};
        if (typeof html !== 'string') {
          return;
        }
        inner?.remove();
        inner = document.createElement('iframe');
        const tokens = String(sandbox ?? 'allow-scripts').split(/\s+/).filter((token) => token && !refused.has(token));
        inner.setAttribute('sandbox', tokens.join(' '));
        inner.srcdoc = html;
        document.body.appendChild(inner);
        return;
      }
      // The inner document has an opaque origin, so '*' is the only target that reaches it
      inner?.contentWindow?.postMessage(message, '*');
      return;
    }
    if (inner && event.source === inner.contentWindow) {
      window.parent.postMessage(event.data, host);
    }
  });

  window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/sandbox-proxy-ready', params: {} }, host);
})();
</script>
</body>
</html>
